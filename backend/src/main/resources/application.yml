spring:
  application:
    name: portfolio-api
  datasource:
    url: jdbc:h2:mem:portfolio;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${PORT:8081}
  forward-headers-strategy: framework

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  mail:
    enabled: ${CONTACT_MAIL_ENABLED:false}
    resend:
      api-key: ${RESEND_API_KEY:}
      base-url: https://api.resend.com
    to-email: ${CONTACT_TO_EMAIL:}
    from-email: ${CONTACT_FROM_EMAIL:}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/portfolio}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:portfolio}
    password: ${DATABASE_PASSWORD:portfolio}
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false
